name: Build EcoRoute AI Flutter Android APK & AAB

on:
  push:
    branches: [ main ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and Play Store App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Installable Android APK (Release)
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Build Google Play Store App Bundle (AAB)
        working-directory: flutter_app
        run: flutter build appbundle --release

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoRoute-AI-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoRoute-AI-PlayStore-AAB
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
