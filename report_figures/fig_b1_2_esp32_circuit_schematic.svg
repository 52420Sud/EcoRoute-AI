<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="950" height="680" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="mcuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="950" height="680" fill="#ffffff"/>

  <!-- Title Banner -->
  <rect x="30" y="20" width="890" height="48" rx="8" fill="#0f172a"/>
  <text x="475" y="50" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">Figure B.1.2: ESP32 Edge Telemetry Microcontroller &amp; Ultrasonic Interfacing Circuit Schematic</text>

  <!-- Section 1: ESP32 DevKit V1 Microcontroller -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <rect width="280" height="480" rx="10" fill="url(#mcuGrad)" stroke="#334155" stroke-width="2"/>
    <rect x="20" y="15" width="240" height="35" rx="5" fill="#3b82f6"/>
    <text x="140" y="38" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">ESP32 DevKit V1 (30-Pin)</text>
    <text x="140" y="65" fill="#94a3b8" font-size="11" text-anchor="middle">Dual-Core 240MHz | 802.11 b/g/n Wi-Fi</text>

    <!-- USB Connector -->
    <rect x="105" y="465" width="70" height="25" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <text x="140" y="482" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">Micro-USB 5V</text>

    <!-- Left Header Pins -->
    <g font-size="10" font-weight="bold" fill="#cbd5e1" text-anchor="start">
      <rect x="5" y="90" width="30" height="14" fill="#334155" rx="2"/>
      <text x="10" y="101">EN</text>
      <rect x="5" y="120" width="30" height="14" fill="#334155" rx="2"/>
      <text x="10" y="131">VP</text>
      <rect x="5" y="150" width="30" height="14" fill="#334155" rx="2"/>
      <text x="10" y="161">VN</text>
      <rect x="5" y="180" width="30" height="14" fill="#334155" rx="2"/>
      <text x="10" y="191">D34</text>
      <rect x="5" y="210" width="30" height="14" fill="#334155" rx="2"/>
      <text x="10" y="221">D35</text>
      <rect x="5" y="240" width="30" height="14" fill="#334155" rx="2"/>
      <text x="10" y="251">D32</text>
      <rect x="5" y="270" width="30" height="14" fill="#334155" rx="2"/>
      <text x="10" y="281">D33</text>
      <rect x="5" y="300" width="30" height="14" fill="#334155" rx="2"/>
      <text x="10" y="311">D25</text>
      <rect x="5" y="330" width="30" height="14" fill="#334155" rx="2"/>
      <text x="10" y="341">D26</text>
      <rect x="5" y="360" width="40" height="14" fill="#f59e0b" rx="2"/>
      <text x="7" y="371" fill="#0f172a">D27 (LED)</text>
      <rect x="5" y="390" width="30" height="14" fill="#334155" rx="2"/>
      <text x="10" y="401">D14</text>
      <rect x="5" y="420" width="30" height="14" fill="#334155" rx="2"/>
      <text x="10" y="431">D12</text>
    </g>

    <!-- Right Header Pins -->
    <g font-size="10" font-weight="bold" fill="#cbd5e1" text-anchor="end">
      <rect x="235" y="90" width="40" height="14" fill="#ef4444" rx="2"/>
      <text x="272" y="101" fill="#ffffff">VIN (5V)</text>
      <rect x="245" y="120" width="30" height="14" fill="#0f172a" stroke="#64748b" rx="2"/>
      <text x="272" y="131" fill="#f8fafc">GND</text>
      <rect x="235" y="150" width="40" height="14" fill="#3b82f6" rx="2"/>
      <text x="272" y="161" fill="#ffffff">IO13(Trg)</text>
      <rect x="235" y="180" width="40" height="14" fill="#10b981" rx="2"/>
      <text x="272" y="191" fill="#ffffff">IO14(Ech)</text>
      <rect x="245" y="210" width="30" height="14" fill="#334155" rx="2"/>
      <text x="272" y="221">D15</text>
      <rect x="245" y="240" width="30" height="14" fill="#334155" rx="2"/>
      <text x="272" y="251">D2</text>
      <rect x="235" y="270" width="40" height="14" fill="#a855f7" rx="2"/>
      <text x="272" y="281" fill="#ffffff">IO4(Buz)</text>
      <rect x="245" y="300" width="30" height="14" fill="#334155" rx="2"/>
      <text x="272" y="311">D16</text>
      <rect x="245" y="330" width="30" height="14" fill="#334155" rx="2"/>
      <text x="272" y="341">D17</text>
      <rect x="245" y="360" width="30" height="14" fill="#334155" rx="2"/>
      <text x="272" y="371">D5</text>
      <rect x="245" y="390" width="30" height="14" fill="#334155" rx="2"/>
      <text x="272" y="401">D18</text>
      <rect x="245" y="420" width="30" height="14" fill="#334155" rx="2"/>
      <text x="272" y="431">3V3</text>
    </g>
  </g>

  <!-- Section 2: HC-SR04 Ultrasonic Sensor Module -->
  <g transform="translate(620, 100)" filter="url(#shadow)">
    <rect width="260" height="170" rx="10" fill="url(#sensorGrad)" stroke="#0369a1" stroke-width="2"/>
    <text x="130" y="28" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">HC-SR04 Distance Sensor</text>

    <!-- Transducer Visuals -->
    <circle cx="70" cy="80" r="32" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>
    <circle cx="70" cy="80" r="14" fill="#64748b"/>
    <text x="70" y="125" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">TRANSMITTER (T)</text>

    <circle cx="190" cy="80" r="32" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>
    <circle cx="190" cy="80" r="14" fill="#64748b"/>
    <text x="190" y="125" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">RECEIVER (R)</text>

    <!-- Pin Headers on Sensor -->
    <g transform="translate(50, 145)" font-size="10" font-weight="bold">
      <rect x="0" y="0" width="35" height="18" fill="#ef4444" rx="3"/>
      <text x="17" y="13" fill="#ffffff" text-anchor="middle">VCC</text>
      <rect x="42" y="0" width="35" height="18" fill="#3b82f6" rx="3"/>
      <text x="59" y="13" fill="#ffffff" text-anchor="middle">TRIG</text>
      <rect x="84" y="0" width="35" height="18" fill="#10b981" rx="3"/>
      <text x="101" y="13" fill="#ffffff" text-anchor="middle">ECHO</text>
      <rect x="126" y="0" width="35" height="18" fill="#0f172a" stroke="#cbd5e1" rx="3"/>
      <text x="143" y="13" fill="#ffffff" text-anchor="middle">GND</text>
    </g>
  </g>

  <!-- Section 3: Voltage Divider Circuit (Center) -->
  <g transform="translate(420, 230)" filter="url(#shadow)">
    <rect width="180" height="160" rx="8" fill="#f8fafc" stroke="#10b981" stroke-width="2"/>
    <rect width="180" height="26" rx="8" fill="#10b981"/>
    <text x="90" y="18" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Voltage Divider (5V -> 3.08V)</text>

    <!-- Resistor R2 (4.7k) -->
    <rect x="65" y="40" width="50" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="3"/>
    <text x="90" y="55" fill="#92400e" font-size="10" font-weight="bold" text-anchor="middle">R2: 4.7 kΩ</text>

    <!-- Tap Point -->
    <circle cx="90" cy="85" r="4" fill="#059669"/>
    <text x="135" y="90" fill="#047857" font-size="10" font-weight="bold">3.08V to IO14</text>

    <!-- Resistor R1 (3.3k) -->
    <rect x="65" y="105" width="50" height="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="3"/>
    <text x="90" y="120" fill="#92400e" font-size="10" font-weight="bold" text-anchor="middle">R1: 3.3 kΩ</text>

    <!-- GND symbol -->
    <line x1="90" y1="127" x2="90" y2="145" stroke="#0f172a" stroke-width="2"/>
    <line x1="80" y1="145" x2="100" y2="145" stroke="#0f172a" stroke-width="2"/>
    <line x1="84" y1="149" x2="96" y2="149" stroke="#0f172a" stroke-width="2"/>
    <line x1="87" y1="153" x2="93" y2="153" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Section 4: Piezo Buzzer & Status LED (Right Bottom) -->
  <!-- Piezo Buzzer -->
  <g transform="translate(640, 310)" filter="url(#shadow)">
    <rect width="230" height="90" rx="8" fill="#f8fafc" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="24" fill="#334155" stroke="#a855f7" stroke-width="2"/>
    <circle cx="45" cy="45" r="8" fill="#94a3b8"/>
    <text x="80" y="35" fill="#581c87" font-size="12" font-weight="bold">Active Piezo Buzzer</text>
    <text x="80" y="55" fill="#6b21a8" font-size="10">R4: 100 Ω Limiter | GPIO 4</text>
    <text x="80" y="72" fill="#475569" font-size="9">Alert: Sounds when Fill ≥ 80%</text>
  </g>

  <!-- Status LED -->
  <g transform="translate(640, 425)" filter="url(#shadow)">
    <rect width="230" height="90" rx="8" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="18" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <text x="80" y="35" fill="#78350f" font-size="12" font-weight="bold">Status Indicator LED</text>
    <text x="80" y="55" fill="#92400e" font-size="10">R3: 130 Ω Limiter | GPIO 27</text>
    <text x="80" y="72" fill="#475569" font-size="9">Blinks on Telemetry / Cloud Sync</text>
  </g>

  <!-- WIRING TRACES -->
  <!-- 1. VCC (+5V Power Line - RED) -->
  <path d="M 335 197 L 400 197 L 400 90 L 680 90 L 680 245" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <text x="510" y="85" fill="#dc2626" font-size="11" font-weight="bold">+5V Power Bus (VIN -> Sensor VCC)</text>

  <!-- 2. System Ground (BLACK) -->
  <path d="M 335 227 L 380 227 L 380 600 L 840 600 L 840 245" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <text x="530" y="595" fill="#0f172a" font-size="11" font-weight="bold">Common System Ground (GND)</text>

  <!-- 3. TRIG Wire (BLUE: GPIO 13 -> Sensor TRIG) -->
  <path d="M 335 257 L 500 257 L 500 170 L 720 170 L 720 245" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <text x="540" y="165" fill="#1d4ed8" font-size="10" font-weight="bold">TRIG: GPIO 13 (10 μs Pulse)</text>

  <!-- 4. ECHO Wire (GREEN: Sensor ECHO -> Divider -> GPIO 14) -->
  <path d="M 765 245 L 765 270 L 510 270" fill="none" stroke="#059669" stroke-width="2.2"/>
  <path d="M 510 315 L 360 315 L 360 287 L 335 287" fill="none" stroke="#059669" stroke-width="2.2"/>

  <!-- 5. Buzzer Wire (PURPLE: GPIO 4 -> Buzzer) -->
  <path d="M 335 377 L 380 377 L 380 340 L 640 340" fill="none" stroke="#9333ea" stroke-width="2"/>

  <!-- 6. LED Wire (ORANGE: GPIO 27 -> LED) -->
  <path d="M 100 467 L 100 520 L 580 520 L 580 460 L 640 460" fill="none" stroke="#d97706" stroke-width="2"/>

  <!-- Bottom Engineering Formula Banner -->
  <rect x="60" y="615" width="830" height="45" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="80" y="642" fill="#1e293b" font-size="12" font-weight="bold">Level Shifting Proof:</text>
  <text x="210" y="642" fill="#0369a1" font-size="12" font-family="Courier New, monospace">V_out = 5.0V * (3.3k / (3.3k + 4.7k)) = 5.0V * 0.4125 = 2.06V - 3.08V (Within ESP32 Safe CMOS Range: &lt; 3.3V)</text>
</svg>
