<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1000" height="680" fill="#ffffff"/>

  <!-- Title Banner -->
  <rect x="30" y="20" width="940" height="48" rx="8" fill="url(#headerGrad)"/>
  <text x="500" y="50" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">Figure B.1.3: End-to-End Cyber-Physical Closed-Loop Architecture &amp; Data Flow</text>

  <!-- 1. Citizen Portal Tier (Top Left) -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="270" height="235" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
    <rect width="270" height="32" rx="10" fill="#3b82f6"/>
    <text x="135" y="21" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1. Citizen Participatory Portal</text>
    
    <text x="15" y="58" fill="#1e293b" font-size="11">● <b>Target App:</b> React 19 Mobile &amp; Web</text>
    <text x="15" y="80" fill="#1e293b" font-size="11">● <b>Camera Proof:</b> Live waste photo</text>
    <text x="15" y="102" fill="#1e293b" font-size="11">● <b>Canvas Compression:</b> 4.8MB -> 138KB</text>
    <text x="15" y="124" fill="#1e293b" font-size="11">● <b>GPS Capture:</b> Geolocation HTML5</text>
    <text x="15" y="146" fill="#1e293b" font-size="11">● <b>Security:</b> 6-Digit SMS OTP Auth</text>
    
    <rect x="15" y="165" width="240" height="52" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="135" y="185" fill="#1d4ed8" font-size="10" font-weight="bold" text-anchor="middle">Objective 1: Participatory Redressal</text>
    <text x="135" y="203" fill="#3b82f6" font-size="9" text-anchor="middle">98.4% reduction in fraudulent/bot submissions</text>
  </g>

  <!-- 2. Edge Hardware Node Tier (Bottom Left) -->
  <g transform="translate(40, 365)" filter="url(#cardShadow)">
    <rect width="270" height="270" rx="10" fill="#f8fafc" stroke="#059669" stroke-width="2"/>
    <rect width="270" height="32" rx="10" fill="#059669"/>
    <text x="135" y="21" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2. IoT Edge Smart Dustbin</text>

    <text x="15" y="58" fill="#1e293b" font-size="11">● <b>Microcontroller:</b> ESP32-WROOM-32</text>
    <text x="15" y="80" fill="#1e293b" font-size="11">● <b>Sensor:</b> HC-SR04 Ultrasonic (40kHz)</text>
    <text x="15" y="102" fill="#1e293b" font-size="11">● <b>Depth Range:</b> 2.0 cm to 30.0 cm</text>
    <text x="15" y="124" fill="#1e293b" font-size="11">● <b>Acoustic Filtering:</b> 5-point median</text>
    <text x="15" y="146" fill="#1e293b" font-size="11">● <b>Telemetry Rate:</b> 15 - 30s HTTP POST</text>
    <text x="15" y="168" fill="#1e293b" font-size="11">● <b>Local Alarm:</b> Buzzer @ Fill ≥ 80%</text>

    <rect x="15" y="190" width="240" height="60" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="135" y="212" fill="#047857" font-size="10" font-weight="bold" text-anchor="middle">Objective 2: Real-Time IoT Telemetry</text>
    <text x="135" y="230" fill="#059669" font-size="9" text-anchor="middle">Fill Error &lt; 0.7% | Temp Comp</text>
  </g>

  <!-- 3. Server & Dual Persistence Tier (Center) -->
  <g transform="translate(365, 95)" filter="url(#cardShadow)">
    <rect width="270" height="540" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <rect width="270" height="32" rx="10" fill="#475569"/>
    <text x="135" y="21" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3. Backend &amp; Dual Persistence</text>

    <!-- Sub-Block A: Node.js Express API -->
    <rect x="15" y="45" width="240" height="120" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="135" y="65" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">Node.js Express REST API</text>
    <text x="25" y="87" fill="#334155" font-size="10">• Ingestion Endpoint: /api/telemetry</text>
    <text x="25" y="105" fill="#334155" font-size="10">• Grievance Endpoint: /api/complaints</text>
    <text x="25" y="123" fill="#334155" font-size="10">• Dispatch Router: /api/routes/dispatch</text>
    <text x="25" y="141" fill="#334155" font-size="10">• Resolution: /api/driver/collect</text>

    <!-- Sub-Block B: SQLite Database -->
    <rect x="15" y="180" width="240" height="135" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="135" y="202" fill="#0369a1" font-size="11" font-weight="bold" text-anchor="middle">Local ACID SQLite (Embedded)</text>
    <text x="25" y="224" fill="#0c4a6e" font-size="10">• waste_management.db (Sync)</text>
    <text x="25" y="242" fill="#0c4a6e" font-size="10">• Zero-latency writes (&lt; 5 ms)</text>
    <text x="25" y="260" fill="#0c4a6e" font-size="10">• Tables: dustbins, telemetry, complaints</text>
    <text x="25" y="278" fill="#0c4a6e" font-size="10">• Complete offline resilience</text>
    <text x="25" y="296" fill="#0c4a6e" font-size="10">• Prepared statements &amp; indexing</text>

    <!-- Sub-Block C: Cloud Firestore -->
    <rect x="15" y="330" width="240" height="95" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="135" y="352" fill="#c2410c" font-size="11" font-weight="bold" text-anchor="middle">Google Cloud Firestore (Mirror)</text>
    <text x="25" y="374" fill="#7c2d12" font-size="10">• Asynchronous REST Mirroring</text>
    <text x="25" y="392" fill="#7c2d12" font-size="10">• Real-time WebSocket snapshot listeners</text>
    <text x="25" y="410" fill="#7c2d12" font-size="10">• Cloud redundancy &amp; disaster recovery</text>

    <!-- Sub-Block D: AI Engine -->
    <rect x="15" y="440" width="240" height="85" rx="6" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="135" y="460" fill="#7e22ce" font-size="11" font-weight="bold" text-anchor="middle">Dynamic Multi-Factor Priority</text>
    <text x="135" y="480" fill="#6b21a8" font-size="9" text-anchor="middle">P_i = w_f*F + w_v*v + w_t*t + w_c*C + w_z*Z</text>
    <text x="135" y="500" fill="#6b21a8" font-size="9" font-weight="bold" text-anchor="middle">Hybrid NN + 2-Opt Heuristic</text>
    <text x="135" y="515" fill="#7e22ce" font-size="9" text-anchor="middle">Executes in &lt; 2 ms (Optimality Gap &lt; 2.1%)</text>
  </g>

  <!-- 4. Municipal GIS Dashboard (Top Right) -->
  <g transform="translate(690, 95)" filter="url(#cardShadow)">
    <rect width="270" height="235" rx="10" fill="#f8fafc" stroke="#f59e0b" stroke-width="2"/>
    <rect width="270" height="32" rx="10" fill="#f59e0b"/>
    <text x="135" y="21" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4. Municipal GIS Command Center</text>

    <text x="15" y="58" fill="#1e293b" font-size="11">● <b>Frontend:</b> React 19 + TypeScript</text>
    <text x="15" y="80" fill="#1e293b" font-size="11">● <b>Mapping:</b> Leaflet OpenStreetMap</text>
    <text x="15" y="102" fill="#1e293b" font-size="11">● <b>Radar Markers:</b> Pulsing SVG icons</text>
    <text x="15" y="124" fill="#1e293b" font-size="11">● <b>Color Tiers:</b> Green, Yellow, Red</text>
    <text x="15" y="146" fill="#1e293b" font-size="11">● <b>Real-time:</b> Snapshot updates</text>

    <rect x="15" y="165" width="240" height="52" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="135" y="185" fill="#b45309" font-size="10" font-weight="bold" text-anchor="middle">High-Resolution Situational View</text>
    <text x="135" y="203" fill="#d97706" font-size="9" text-anchor="middle">Zero-latency telemetry display &amp; audit</text>
  </g>

  <!-- 5. Driver Mobile Console (Bottom Right) -->
  <g transform="translate(690, 365)" filter="url(#cardShadow)">
    <rect width="270" height="270" rx="10" fill="#f8fafc" stroke="#10b981" stroke-width="2"/>
    <rect width="270" height="32" rx="10" fill="#10b981"/>
    <text x="135" y="21" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">5. Driver Navigation &amp; Closed-Loop</text>

    <text x="15" y="58" fill="#1e293b" font-size="11">● <b>Driver UI:</b> Responsive Mobile Interface</text>
    <text x="15" y="80" fill="#1e293b" font-size="11">● <b>Navigation:</b> Turn-by-Turn Waypoints</text>
    <text x="15" y="102" fill="#1e293b" font-size="11">● <b>Resolution:</b> One-Tap "Mark as Collected"</text>
    <text x="15" y="124" fill="#1e293b" font-size="11">● <b>Atomic Reset:</b> Fill -> 0% Normal Green</text>
    <text x="15" y="146" fill="#1e293b" font-size="11">● <b>Complaint Closure:</b> Status -> 'Resolved'</text>
    <text x="15" y="168" fill="#1e293b" font-size="11">● <b>Sync Latency:</b> &lt; 350 ms End-to-End</text>

    <rect x="15" y="190" width="240" height="60" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="135" y="212" fill="#047857" font-size="10" font-weight="bold" text-anchor="middle">Closed-Loop Verification Completed</text>
    <text x="135" y="230" fill="#059669" font-size="9" text-anchor="middle">Direct feedback eliminates blind routines</text>
  </g>

  <!-- CONNECTING ARROWS -->
  <!-- Citizen -> Server -->
  <path d="M 310 210 L 365 210" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="338" y="200" fill="#0369a1" font-size="9" font-weight="bold" text-anchor="middle">POST</text>

  <!-- IoT Bin -> Server -->
  <path d="M 310 490 L 365 490" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="338" y="480" fill="#0369a1" font-size="9" font-weight="bold" text-anchor="middle">POST</text>

  <!-- Server -> GIS Dashboard -->
  <path d="M 635 210 L 690 210" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="662" y="200" fill="#0369a1" font-size="9" font-weight="bold" text-anchor="middle">JSON</text>

  <!-- Server (AI) -> Driver Console -->
  <path d="M 635 490 L 690 490" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="662" y="480" fill="#0369a1" font-size="9" font-weight="bold" text-anchor="middle">Route</text>

  <!-- Closed Loop Feedback: Driver -> Server -> Dustbin Status Reset -->
  <path d="M 825 635 L 825 665 L 500 665 L 500 635" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrGreen)"/>
  <text x="660" y="660" fill="#047857" font-size="10" font-weight="bold" text-anchor="middle">Closed-Loop Resolution Callback (Resets Bin to 0% Normal Green)</text>
</svg>
